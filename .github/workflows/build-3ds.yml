name: 3DS (melonDS Link)

on:
  push:
    branches:
      - master
      - ci/*
    paths:
      - 'link3ds/**'
      - 'src/frontend/qt_sdl/LinkProto.h'
      - '.github/workflows/build-3ds.yml'
  pull_request:
    paths:
      - 'link3ds/**'
      - 'src/frontend/qt_sdl/LinkProto.h'
  workflow_dispatch:

jobs:
  build:
    name: link3ds
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
    - name: Check out sources
      uses: actions/checkout@v6
    - name: Build
      run: make -C link3ds
    - uses: actions/upload-artifact@v7
      with:
        name: link3ds-build
        path: |
          link3ds/melonDS-Link.3dsx
          link3ds/melonDS-Link.elf

  # makerom needs a newer glibc than the devkitPro container has
  cia:
    name: cia
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Check out sources
      uses: actions/checkout@v6
    - uses: actions/download-artifact@v7
      with:
        name: link3ds-build
        path: link3ds
    - name: Cache makerom/bannertool
      uses: actions/cache@v4
      with:
        path: link3ds/cia/.tools
        key: cia-tools-v1
    - name: Build .cia (install with FBI for a Home Menu icon)
      env:
        GH_TOKEN: ${{ github.token }}
      run: sh link3ds/cia/build-cia.sh link3ds/melonDS-Link.elf link3ds/melonDS-Link.cia
    - uses: actions/upload-artifact@v7
      with:
        name: melonDS-Link-3ds
        path: |
          link3ds/melonDS-Link.cia
          link3ds/melonDS-Link.3dsx
